<style>
/* Layout: a calm header, then a row of three plan cards with the discounted one raised; payment strip below */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --fg:#0f1b2d; --muted:#5a6880; --line:#dbe3ef;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111d; --surface:#111b2c; --fg:#e8eef8; --muted:#93a2bb; --line:#22324a;
  --accent:#5b8cff; --accent-ink:#06101f; --deal:#ff6a4f; --ok:#3ccf91; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#111b2c; --fg:#e8eef8; --muted:#93a2bb; --line:#22324a;
  --accent:#5b8cff; --accent-ink:#06101f; --deal:#ff6a4f; --ok:#3ccf91; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding-block:22px;gap:16px}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status b{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.intro{padding-block:36px 28px;max-width:640px}
.intro h1{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1.3;margin:0 0 10px;text-wrap:balance}
.intro p{color:var(--muted);margin:0}
.toggle{display:inline-flex;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.toggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 16px;border-radius:7px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start;padding-block:20px 10px}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0;position:relative}
.card.hot{border:2px solid var(--deal);transform:translateY(-10px)}
@media (max-width:860px){.card.hot{transform:none}}
.ribbon{position:absolute;top:-14px;inset-inline-start:22px;background:var(--deal);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;padding:4px 12px;border-radius:6px}
.name{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.for{color:var(--muted);font-size:14px;margin-top:-12px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .now{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.price .per{color:var(--muted);font-size:14px}
.price .was{color:var(--muted);text-decoration:line-through;font-family:var(--mono);font-size:15px}
.save{color:var(--deal);font-size:13px;font-weight:600;margin-top:-10px}
.specs{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:15px;border-top:1px solid var(--line);padding-top:16px}
.specs li{display:flex;justify-content:space-between;gap:12px}
.specs span{color:var(--muted)}
.specs strong{font-family:var(--mono);font-weight:500;font-size:14px;direction:ltr}
.buy{border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;cursor:pointer;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.card.hot .buy{background:var(--deal);color:#fff;border-color:var(--deal)}

.buy:focus-visible,.toggle button:focus-visible,.pm:focus-within,.close:focus-visible,.confirm:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pay{padding-block:40px 60px;display:flex;flex-direction:column;gap:14px}
.pay h2{font-family:var(--display);font-size:18px;margin:0}
.methods{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.dot{width:26px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--mono)}
.d-visa{background:#1a1f71}.d-mc{background:#eb001b}.d-pp{background:#003087}.d-vf{background:#e60000}.d-gp{background:#3c4043}
.note{color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-family:var(--display);margin:0;font-size:20px}
.sum{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:15px}
.sum b{font-family:var(--mono);direction:ltr}
.pms{display:grid;gap:8px}
.pm{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.pm:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.pm input{accent-color:var(--accent)}
.row{display:flex;gap:10px}
.confirm{flex:1;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.close{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}
.done{color:var(--ok);font-weight:600;font-size:15px}
.vf{display:flex;flex-direction:column;gap:6px}
.vf label{font-size:14px;font-weight:500}
.vf input{font:inherit;font-family:var(--mono);direction:ltr;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.vf input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.vf .err{color:var(--deal);font-size:13px}
.vf .hint{color:var(--muted);font-size:13px}
.paypal{flex:1;border:0;border-radius:10px;padding:12px;background:#ffc439;color:#111;font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer;direction:ltr}
.paypal span{color:#003087}.paypal em{color:#0079c1;font-style:normal}
.otp{display:flex;flex-direction:column;gap:8px}
.otp p{margin:0;font-size:14px;color:var(--muted)}
.otp p b{color:var(--fg);font-family:var(--mono);direction:ltr;display:inline-block}
.otp input{font-family:var(--mono);font-size:26px;letter-spacing:14px;text-align:center;direction:ltr;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.otp input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.otp .err{color:var(--deal);font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0;align-self:flex-start}
.success{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.success .box{max-width:460px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px}
.success h2{font-family:var(--display);font-size:28px;margin:0}
.success p{margin:0;color:var(--muted)}
.receipt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;font-size:15px;text-align:start}
.receipt div{display:flex;justify-content:space-between;gap:12px}
.receipt span{color:var(--muted)}
.receipt b{font-family:var(--mono);font-weight:500;direction:ltr}
.wa{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:15px;text-align:start}
.home{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 20px;font:inherit;cursor:pointer}
.paypal:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* site shell */
html{scroll-behavior:smooth}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand svg{width:36px;height:36px;flex:none}

.links{display:flex;gap:22px;font-size:15px}

.cta{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:15px;padding:9px 18px;border-radius:9px;white-space:nowrap}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:56px 40px}

.hero>div{min-width:0}

.actions{display:flex;gap:12px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;padding:9px 18px;border-radius:9px;background:var(--surface)}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;font-size:14px;color:var(--muted)}
.trust b{color:var(--fg);font-family:var(--mono);font-weight:500;direction:ltr;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;direction:ltr;font-family:var(--mono);font-size:13px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.panel .foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
section.block{padding-block:56px 20px}
.sh{max-width:620px;margin-bottom:26px}
.sh h2{font-family:var(--display);font-size:clamp(24px,3.6vw,32px);margin:0 0 8px;text-wrap:balance}
.sh p{color:var(--muted);margin:0}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
@media (max-width:860px){.feats{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.feats{grid-template-columns:1fr}}
.feat{display:flex;gap:14px;min-width:0}

.feat p{margin:0;color:var(--muted);font-size:15px}
.faq{display:grid;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}

.contact{margin-block:56px 0;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.contact h2{font-family:var(--display);margin:0 0 6px;font-size:26px}
.contact p{margin:0;opacity:.85}

.copy{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;font-size:13px}
.pay{padding-block:30px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

const ICONS=['<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>','<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>','<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>','<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8"/>','<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.9A8 8 0 1 1 21 12z"/>','<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'];

const methods=["visa","mc","vf","pp","gp"];
let lang="en",cycle="m",current=null,otpStep=false;
try{const s=localStorage.getItem("hosting-lang");if(s==="en"||s==="ar")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const t=(k,v={})=>String(T[lang][k]).replace(/\{(\w+)\}/g,(_,x)=>v[x]);
const fmt=n=>"$"+n.toFixed(2);
function priceOf(p){const base=cycle==="m"?p.m:p.m*10;const now=p.off?base*(1-p.off/100):base;return{base,now};}

function renderPlans(){
  $("plans").innerHTML=plans.map(p=>{const {base,now}=priceOf(p);const d=T[lang].plans[p.id];
    return `<article class="card${p.off?" hot":""}">
      ${p.off?`<div class="ribbon">${t("ribbon",{p:p.off})}</div>`:""}
      <h2 class="name">${p.name}</h2><div class="for">${d[0]}</div>
      <div class="price">${p.off?`<span class="was">${fmt(base)}</span>`:""}<span class="now">${fmt(now)}</span><span class="per">${t(cycle==="m"?"per.m":"per.y")}</span></div>
      ${p.off?`<div class="save">${t("save",{s:fmt(base-now)})}</div>`:""}
      <ul class="specs">${d[1].map((l,i)=>`<li><span>${l}</span><strong>${d[2][i]}</strong></li>`).join("")}</ul>
      <button class="buy" data-id="${p.id}">${t("buy")}</button></article>`}).join("");
}
function applyLang(){
  const r=document.documentElement;r.lang=lang;r.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll("[data-h]").forEach(el=>el.innerHTML=t(el.dataset.h));
  document.querySelectorAll("[data-a]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.a)));
  $("langbtn").textContent=t("lang.btn");
  $("chips").innerHTML=methods.map(m=>`<div class="chip"><span class="dot d-${m}">${m.toUpperCase()}</span>${t("pm."+m)}</div>`).join("");
  const checked=document.querySelector('input[name="pm"]:checked');const sel=checked?checked.value:"visa";
  $("pms").innerHTML=methods.map(m=>`<label class="pm"><input type="radio" name="pm" id="pm-${m}" value="${m}" ${m===sel?"checked":""}><span class="dot d-${m}">${m.toUpperCase()}</span>${t("pm."+m)}</label>`).join("");
  $("feats").innerHTML=T[lang].f.map((f,i)=>`<div class="feat"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</svg></div><div><h3>${f[0]}</h3><p>${f[1]}</p></div></div>`).join("");
  renderPlans();
  if(current)$("mplan").textContent=t("m.plan",{n:current.name,c:t("cycle."+cycle)});
  if(!$("ov").hidden)syncButtons();
}
$("langbtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("hosting-lang",lang)}catch(e){}applyLang();};

document.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{cycle=b.dataset.cycle;
  document.querySelectorAll(".toggle button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderPlans();});

const ov=$("ov"),vfbox=$("vfbox"),ppbtn=$("ppbtn"),mconfirm=$("mconfirm");
function method(){return document.querySelector('input[name="pm"]:checked').value;}
function syncButtons(){const v=method();
  ppbtn.hidden=v!=="pp"||otpStep;mconfirm.hidden=v==="pp"&&!otpStep;
  mconfirm.textContent=otpStep?t("m.confirmcode"):(v==="vf"?t("m.payvf"):t("m.continue"));}
function syncMethod(){otpStep=false;$("otpbox").hidden=true;$("pms").hidden=false;
  vfbox.hidden=method()!=="vf";$("mdone").hidden=true;$("vferr").hidden=true;syncButtons();}
$("plans").addEventListener("click",e=>{const b=e.target.closest(".buy");if(!b)return;
  current=plans.find(p=>p.id===b.dataset.id);
  $("mplan").textContent=t("m.plan",{n:current.name,c:t("cycle."+cycle)});
  $("mprice").textContent=fmt(priceOf(current).now);
  syncMethod();ov.hidden=false;});
$("pms").addEventListener("change",syncMethod);
$("vfnum").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"");$("vferr").hidden=true;});
$("otpcode").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"");$("otperr").hidden=true;});
$("otpback").onclick=()=>{syncMethod();$("vfnum").focus();};
ppbtn.onclick=()=>{$("mdone").textContent=t("m.ppnote");$("mdone").hidden=false;};
$("mclose").onclick=()=>ov.hidden=true;
ov.addEventListener("click",e=>{if(e.target===ov)ov.hidden=true});
$("gohome").onclick=()=>{$("succ").hidden=true;location.hash="#plans-sec";};
$("mf").addEventListener("submit",e=>{e.preventDefault();const v=method(),d=$("mdone");
  if(v==="vf"){const n=$("vfnum").value;
    if(!otpStep){
      if(!/^010\d{8}$/.test(n)){$("vferr").hidden=false;return;}
      otpStep=true;$("otpnum").textContent=n;$("otpcode").value="";
      vfbox.hidden=true;$("pms").hidden=true;$("otpbox").hidden=false;syncButtons();$("otpcode").focus();return;}
    if($("otpcode").value!==OTP_CODE){$("otperr").hidden=false;return;}
    $("rplan").textContent=$("mplan").textContent;$("rprice").textContent=$("mprice").textContent;
    $("rorder").textContent="#H"+Math.floor(100000+Math.random()*900000);$("rnum").textContent=n;
    ov.hidden=true;$("succ").hidden=false;return;}
  d.textContent=t("m.chosen",{m:t("pm."+v)});d.hidden=false;mconfirm.hidden=true;});

$("bars").innerHTML=Array.from({length:30},(_,i)=>{const h=i===11?62:84+((i*37)%16);return `<span class="${i===11?"w":""}" style="height:${h}%"></span>`}).join("");
applyLang();
